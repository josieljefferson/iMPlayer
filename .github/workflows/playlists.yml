name: playlists

on:
  schedule:
    - cron: '5 4,10,16,22 * * *'  # 00:01 e 12:01 BRT
  workflow_dispatch:

# Permite que o GITHUB_TOKEN faça commit e push
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de playlists
        run: |
          python playlists.py

      - name: Confirmar arquivos baixados
        run: |
          echo "Arquivos baixados:"
          ls -lah playlists

          echo
          echo "Verificando arquivos não vazios:"

          for file in playlists/*; do
            if [ ! -s "$file" ]; then
              echo "ERRO: arquivo vazio: $file"
              exit 1
            fi
          done

      - name: Verificar mudanças no Git
        id: git_status
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> "$GITHUB_ENV"
          else
            echo "changes=false" >> "$GITHUB_ENV"
          fi

      - name: Configurar Git
        if: env.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Atualizar repositório antes do commit
        if: env.changes == 'true'
        run: |
          git pull --rebase origin main

      - name: Commit e push dos arquivos baixados
        if: env.changes == 'true'
        run: |
          git add playlists/

          git commit -m "Atualização automática dos arquivos baixados"

          git push origin main

      - name: Notificar sucesso
        if: success()
        run: |
          echo "Workflow executado com sucesso!"

      - name: Notificar falha
        if: failure()
        run: |
          echo "Workflow falhou!"
