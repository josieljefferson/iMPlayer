# =============================================================
# 📥 MEDIA DOWNLOADER
# =============================================================
# Baixa automaticamente:
#
#   playlists/*.m3u
#   epg/*.xml.gz
#   iMPlayer/*.m3u
#   iMPlayer/*.xml.gz
#   playlist.m3u
#   playlists.m3u
#
# Usa exclusivamente o GITHUB_TOKEN automático.
#
# NÃO utiliza:
#
#   MY_DOWNLOAD_GITHUB_TOKEN
#
# =============================================================

name: '📥 Download Playlists and EPGs'


# =============================================================
# EVENTOS
# =============================================================

on:

  # Execução manual
  workflow_dispatch:

  # Execução automática
  #
  # 03:01 UTC = 00:01 Brasília
  #
  # Executa nos dias ímpares:
  #
  # 1, 3, 5, 7...
  #
  schedule:
    - cron: '1 3 1-31/2 * *'


# =============================================================
# PERMISSÕES
# =============================================================
#
# Autoriza o GITHUB_TOKEN automático a:
#
#   - ler o repositório
#   - criar commits
#   - fazer push
#
# Não é necessário PAT.
#
# =============================================================

permissions:
  contents: write


# =============================================================
# CONCORRÊNCIA
# =============================================================
#
# Evita duas execuções simultâneas alterando a main.
#
# =============================================================

concurrency:
  group: media-downloader
  cancel-in-progress: false


# =============================================================
# JOB
# =============================================================

jobs:

  download-media:

    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: '🔁 Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

          # Usa explicitamente o GITHUB_TOKEN automático.
          token: ${{ github.token }}

          # Mantém as credenciais configuradas pelo checkout
          # para permitir o git push.
          persist-credentials: true


      # =========================================================
      # PYTHON
      # =========================================================

      - name: '🐍 Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      # =========================================================
      # DEPENDÊNCIAS
      # =========================================================

      - name: '📦 Install dependencies'
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install requests


      # =========================================================
      # TIMEZONE
      # =========================================================

      - name: '⏰ Set timezone to America/Fortaleza'
        run: |
          set -e

          sudo ln -sf \
            /usr/share/zoneinfo/America/Fortaleza \
            /etc/localtime

          echo "America/Fortaleza" | \
            sudo tee /etc/timezone

          export TZ=America/Fortaleza

          echo
          echo "Timezone:"
          date '+%d/%m/%Y %H:%M:%S %Z %z'


      # =========================================================
      # EXECUTAR DOWNLOADER
      # =========================================================

      - name: '🚀 Run media downloader'
        run: |
          set -e

          python media_downloader.py


      # =========================================================
      # VALIDAR ARQUIVOS
      # =========================================================

      - name: '🔎 Validate downloaded files'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VALIDANDO ARQUIVOS"
          echo "=========================================="

          # -----------------------------------------------------
          # PLAYLISTS
          # -----------------------------------------------------

          for file in \
            playlists/*.m3u \
            iMPlayer/*.m3u \
            playlist.m3u \
            playlists.m3u
          do

            if [ -f "$file" ]; then

              echo "Validando M3U: $file"

              if [ ! -s "$file" ]; then
                echo "ERRO: arquivo vazio: $file"
                exit 1
              fi

              if ! head -n 1 "$file" | grep -q '^#EXTM3U'; then
                echo "ERRO: M3U inválido: $file"
                exit 1
              fi

              echo "OK: $file"

            fi

          done


          # -----------------------------------------------------
          # EPG GZIP
          # -----------------------------------------------------

          for file in \
            epg/*.xml.gz \
            iMPlayer/*.xml.gz
          do

            if [ -f "$file" ]; then

              echo "Validando GZIP: $file"

              if [ ! -s "$file" ]; then
                echo "ERRO: arquivo vazio: $file"
                exit 1
              fi

              gzip -t "$file"

              echo "OK GZIP: $file"

            fi

          done


          echo
          echo "=========================================="
          echo "VALIDAÇÃO CONCLUÍDA"
          echo "=========================================="


      # =========================================================
      # CONFIGURAR GIT
      # =========================================================

      - name: '⚙️ Configure Git'
        run: |
          git config user.name "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # =========================================================
      # MOSTRAR STATUS
      # =========================================================

      - name: '🔎 Check Git status'
        run: |
          echo "=========================================="
          echo "STATUS DO GIT"
          echo "=========================================="

          git status --short


      # =========================================================
      # ADICIONAR SOMENTE ARQUIVOS DE SAÍDA
      # =========================================================
      #
      # NÃO usa:
      #
      #   git add .
      #
      # para evitar incluir:
      #
      #   media_downloader.log
      #   arquivos temporários
      #   outros arquivos do projeto
      #
      # =========================================================

      - name: '📦 Stage downloaded files'
        run: |
          set -e

          git add \
            playlists/ \
            epg/ \
            iMPlayer/ \
            playlist.m3u \
            playlists.m3u

      # =========================================================
      # VERIFICAR ALTERAÇÕES
      # =========================================================

      - name: '🔎 Check staged changes'
        id: staged
        shell: bash
        run: |
          if git diff --cached --quiet; then

            echo "changes=false" >> "$GITHUB_OUTPUT"

            echo
            echo "Nenhuma alteração encontrada."

          else

            echo "changes=true" >> "$GITHUB_OUTPUT"

            echo
            echo "Alterações encontradas:"

            git diff --cached --stat

          fi


      # =========================================================
      # COMMIT
      # =========================================================

      - name: '💾 Commit changes'
        if: steps.staged.outputs.changes == 'true'
        run: |
          set -e

          export TZ=America/Fortaleza

          git commit \
            -m "Atualização automática das playlists e EPGs - $(date '+%d/%m/%Y %H:%M:%S %Z')"


      # =========================================================
      # ATUALIZAR MAIN
      # =========================================================
      #
      # O commit já existe localmente.
      #
      # Se alguém alterou a main depois do checkout,
      # o rebase reorganiza o nosso commit sobre a versão
      # mais recente da branch.
      #
      # =========================================================

      - name: '🔄 Rebase com origin/main'
        if: steps.staged.outputs.changes == 'true'
        run: |
          set -e

          git fetch origin main

          git rebase origin/main


      # =========================================================
      # PUSH
      # =========================================================
      #
      # NÃO USA:
      #
      #   MY_DOWNLOAD_GITHUB_TOKEN
      #
      # NÃO USA PAT.
      #
      # O checkout configurou automaticamente:
      #
      #   GITHUB_TOKEN
      #
      # através de:
      #
      #   token: ${{ github.token }}
      #
      # =========================================================

      - name: '🚀 Push changes'
        if: steps.staged.outputs.changes == 'true'
        run: |
          set -e

          git push origin HEAD:main


      # =========================================================
      # LOG
      # =========================================================

      - name: '📤 Upload logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-downloader-logs
          path: media_downloader.log
          if-no-files-found: warn
          retention-days: 7


      # =========================================================
      # SUCESSO
      # =========================================================

      - name: '✅ Success'
        if: success()
        run: |
          echo
          echo "=========================================="
          echo "DOWNLOAD CONCLUÍDO COM SUCESSO"
          echo "=========================================="


      # =========================================================
      # FALHA
      # =========================================================

      - name: '❌ Failure'
        if: failure()
        run: |
          echo
          echo "=========================================="
          echo "WORKFLOW FINALIZADO COM ERRO"
          echo "=========================================="
