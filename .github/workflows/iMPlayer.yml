name: iMPlayer

on:
  schedule:
    # 00:05 e 12:05 no horário de Brasília
    # 03:05 e 15:05 UTC
    - cron: '0 4,10,16,22 * * *'

  workflow_dispatch:

# Permissão necessária para o GITHUB_TOKEN
# fazer commit e push no próprio repositório.
permissions:
  contents: write

# Impede duas execuções simultâneas
# de alterarem a branch main ao mesmo tempo.
concurrency:
  group: implayer-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: 📥 Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # CONFIGURAR PYTHON
      # ============================================================
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ============================================================
      # INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # EXECUTAR SCRIPT
      # ============================================================
      - name: 📥 Executar iMPlayer.py
        run: |
          python iMPlayer.py

      # ============================================================
      # VALIDAR ARQUIVOS
      # ============================================================
      - name: 🔎 Validar arquivos baixados
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          if [ ! -d "iMPlayer" ]; then
            echo "ERRO: diretório iMPlayer não existe."
            exit 1
          fi

          ls -lah iMPlayer/

          echo
          echo "=========================================="
          echo "VALIDANDO ARQUIVOS M3U"
          echo "=========================================="

          M3U_COUNT=0

          for file in iMPlayer/*.m3u; do
            if [ -f "$file" ]; then

              M3U_COUNT=$((M3U_COUNT + 1))

              if [ ! -s "$file" ]; then
                echo "ERRO: arquivo M3U vazio: $file"
                exit 1
              fi

              echo "OK M3U: $file"
            fi
          done

          if [ "$M3U_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum arquivo M3U foi encontrado."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "VALIDANDO ARQUIVOS XML.GZ"
          echo "=========================================="

          GZ_COUNT=0

          for file in iMPlayer/*.xml.gz; do
            if [ -f "$file" ]; then

              GZ_COUNT=$((GZ_COUNT + 1))

              if [ ! -s "$file" ]; then
                echo "ERRO: arquivo XML.GZ vazio: $file"
                exit 1
              fi

              if gzip -t "$file"; then
                echo "OK GZIP: $file"
              else
                echo "ERRO: arquivo GZIP inválido: $file"
                exit 1
              fi
            fi
          done

          if [ "$GZ_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum arquivo XML.GZ foi encontrado."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "VALIDAÇÃO CONCLUÍDA COM SUCESSO"
          echo "=========================================="

      # ============================================================
      # CONFIGURAR GIT
      # ============================================================
      - name: ⚙️ Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # ATUALIZAR REFERÊNCIA DA MAIN
      # ============================================================
      - name: 🔄 Atualizar branch main
        run: |
          set -e

          git fetch origin main

          git reset --mixed origin/main

      # ============================================================
      # VERIFICAR ALTERAÇÕES
      # ============================================================
      - name: 🔎 Verificar alterações
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- iMPlayer/)" ]]; then

            echo "changes=true" >> "$GITHUB_OUTPUT"

            echo
            echo "=========================================="
            echo "ALTERAÇÕES ENCONTRADAS"
            echo "=========================================="

            git status --short -- iMPlayer/

          else

            echo "changes=false" >> "$GITHUB_OUTPUT"

            echo
            echo "=========================================="
            echo "NENHUMA ALTERAÇÃO ENCONTRADA"
            echo "=========================================="

          fi

      # ============================================================
      # COMMIT
      # ============================================================
      - name: 💾 Commit arquivos atualizados
        if: steps.changes.outputs.changes == 'true'
        run: |
          set -e

          git add iMPlayer/

          git commit \
            -m "Atualização automática dos arquivos do iMPlayer"

      # ============================================================
      # PUSH
      #
      # NÃO UTILIZA:
      #
      # MY_DOWNLOAD_GITHUB_TOKEN
      #
      # Usa o GITHUB_TOKEN automático do GitHub Actions.
      # ============================================================
      - name: 🚀 Push para main
        if: steps.changes.outputs.changes == 'true'
        run: |
          set -e

          git push origin HEAD:main

      # ============================================================
      # SUCESSO
      # ============================================================
      - name: ✅ Notificar sucesso
        if: success()
        run: |
          echo
          echo "=========================================="
          echo "iMPlayer executado com sucesso!"
          echo "=========================================="

      # ============================================================
      # FALHA
      # ============================================================
      - name: ❌ Notificar falha
        if: failure()
        run: |
          echo
          echo "=========================================="
          echo "ERRO durante a execução do iMPlayer."
          echo "=========================================="
