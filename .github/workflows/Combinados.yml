# Nome do workflow
name: Workflows Combinados

# Definição dos gatilhos (trigger) do workflow
on:
  schedule:
    # Agenda para executar playlists.yml nos dias pares do mês às 3:01 AM (horário UTC)
    - cron: '1 3 2-30/2 * *'  # Executa a cada 2 dias, começando no dia 2, às 03:01 UTC (00:01 em Fortaleza)
    
    # Agenda para executar iMPlayer.yml e playlists.m3u.yml nos dias ímpares do mês às 3:01 AM (horário UTC)
    - cron: '1 3 1-31/2 * *'  # Executa a cada 2 dias, começando no dia 1, às 03:01 UTC (00:01 em Fortaleza)
  
  # Permite a execução manual do workflow através da interface do GitHub
  workflow_dispatch:

# Definição dos jobs (tarefas) que serão executados
jobs:
  # Job para processar as playlists
  playlists:
    name: Executar playlists
    # Condição para executar apenas quando o agendamento correspondente for acionado ou quando for executado manualmente
    if: github.event.schedule == '1 3 2-30/2 * *' || github.event_name == 'workflow_dispatch'
    # Define o sistema operacional que será usado
    runs-on: ubuntu-latest

    # Passos (steps) que serão executados neste job
    steps:
    # Passo 1: Fazer checkout do repositório
    - name: Checkout repositório
      uses: actions/checkout@v4

    # Passo 2: Configurar o ambiente Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'  # Versão do Python a ser usada

    # Passo 3: Configurar cache para as dependências do pip (para acelerar execuções futuras)
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip  # Local onde o pip armazena os pacotes baixados
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}  # Chave do cache baseada no OS e requirements.txt
        restore-keys: |
          ${{ runner.os }}-pip-  # Padrão de fallback para a chave do cache

    # Passo 4: Instalar as dependências necessárias
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip  # Atualiza o pip
        pip install requests  # Instala a biblioteca requests

    # Passo 5: Executar o script principal que baixa as playlists
    - name: Executar script de playlists
      run: python playlists.py

    # Passo 6: Adicionar timestamp com fuso horário de Fortaleza em todos os arquivos baixados
    - name: Atualizar timestamp nos arquivos baixados
      run: |
        # Define o fuso horário de Fortaleza (America/Fortaleza)
        export TZ='America/Fortaleza'
        # Percorre todos os arquivos na pasta playlists e adiciona o timestamp
        for file in $(find playlists -type f); do
          echo "# Atualizado em $(date '+%d/%m/%Y %H:%M:%S %Z')" >> "$file"
        done

    # Passo 7: Listar os arquivos baixados para verificação (debug)
    - name: Confirmar arquivos baixados
      run: ls -la playlists

    # Passo 8: Verificar se houve mudanças nos arquivos
    - name: Verificar mudanças no Git
      id: git_status
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changes=true" >> $GITHUB_ENV
        else
          echo "changes=false" >> $GITHUB_ENV
        fi

    # Passo 9: Fazer commit e push das alterações se houver mudanças
    - name: Commit e push do arquivo baixado (se houver mudanças)
      if: env.changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlists/
        git commit -m "Atualização automática dos arquivos baixados (playlists) - $(date -d 'now' '+%d/%m/%Y %H:%M:%S') - America/Fortaleza"
        git pull --rebase origin main
        git push https://x-access-token:${{ secrets.MY_DOWNLOAD_GITHUB_TOKEN }}@github.com/josieljluz/iMPlayer.git main

  # Job para processar o iMPlayer
  implayer:
    name: Executar iMPlayer
    # Condição para executar apenas quando o agendamento correspondente for acionado ou quando for executado manualmente
    if: github.event.schedule == '1 3 1-31/2 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: playlists  # Depende da conclusão do job playlists (opcional)

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de iMPlayer
      run: python iMPlayer.py

    - name: Atualizar timestamp nos arquivos baixados
      run: |
        # Define o fuso horário de Fortaleza
        export TZ='America/Fortaleza'
        # Adiciona timestamp em todos os arquivos específicos do iMPlayer
        for file in iMPlayer/iMPlayer_1.m3u iMPlayer/iMPlayer_1.xml.gz iMPlayer/iMPlayer_2.m3u \
                    iMPlayer/iMPlayer_2.xml.gz iMPlayer/iMPlayer_3.m3u iMPlayer/iMPlayer_3.xml.gz \
                    iMPlayer/iMPlayer_4.m3u iMPlayer/iMPlayer_5.m3u; do
          echo "# Atualizado em $(date '+%d/%m/%Y %H:%M:%S %Z')" >> "$file"
        done

    - name: Confirmar arquivos baixados
      run: ls -la iMPlayer

    - name: Verificar mudanças no Git
      id: git_status
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changes=true" >> $GITHUB_ENV
        else
          echo "changes=false" >> $GITHUB_ENV
        fi

    - name: Commit e push do arquivo baixado (se houver mudanças)
      if: env.changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add iMPlayer/
        git commit -m "Atualização automática dos arquivos baixados (iMPlayer) - $(date -d 'now' '+%d/%m/%Y %H:%M:%S') - America/Fortaleza"
        git pull --rebase origin main
        git push https://x-access-token:${{ secrets.MY_DOWNLOAD_GITHUB_TOKEN }}@github.com/josieljluz/iMPlayer.git main

  # Job para processar as playlists.m3u
  playlists_m3u:
  name: Executar playlists.m3u
  if: github.event.schedule == '1 3 1-31/2 * *' || github.event_name == 'workflow_dispatch'
  runs-on: ubuntu-latest
  needs: implayer

  steps:
  - name: Checkout repositório
    uses: actions/checkout@v4
    with:
      fetch-depth: 0  # Importante: faz fetch de todo o histórico para o rebase

  - name: Configurar Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.8'

  - name: Cache pip dependencies
    uses: actions/cache@v3
    with:
      path: ~/.cache/pip
      key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      restore-keys: |
        ${{ runner.os }}-pip-

  - name: Instalar dependências
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Executar script de playlists.m3u
    run: python playlists.m3u.py

  - name: Atualizar timestamp nos arquivos baixados
    run: |
      export TZ='America/Fortaleza'
      for file in $(find . -maxdepth 1 -type f -name "*.m3u"); do
        echo "# Atualizado em $(date '+%d/%m/%Y %H:%M:%S %Z')" >> "$file"
      done

  - name: Confirmar arquivos baixados
    run: ls -la *.m3u

  - name: Verificar mudanças no Git
    id: git_status
    run: |
      if [[ -n "$(git status --porcelain)" ]]; then
        echo "changes=true" >> $GITHUB_ENV
      else
        echo "changes=false" >> $GITHUB_ENV
      fi

  - name: Commit e push do arquivo baixado (se houver mudanças)
    if: env.changes == 'true'
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      # Primeiro atualiza o repositório local
      git fetch origin
      git reset --hard origin/main
      
      # Adiciona e commita as mudanças
      git add *.m3u
      git commit -m "Atualização automática dos arquivos baixados (playlists.m3u) - $(date -d 'now' '+%d/%m/%Y %H:%M:%S') - America/Fortaleza"
      
      # Faz o push forçado se necessário
      git push https://x-access-token:${{ secrets.MY_DOWNLOAD_GITHUB_TOKEN }}@github.com/josieljluz/iMPlayer.git main --force-if-includes
